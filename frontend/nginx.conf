# Served as /etc/nginx/conf.d/default.conf, so this file is in the http context.

# Ask the backend to upgrade only when the client asked for it. For ordinary
# requests the header is empty, which nginx omits, so connections stay reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep the caller's request id if there is one, otherwise make one. The backend
# accepts [A-Za-z0-9._-]{1,64} and replaces anything else; $request_id is 32 hex.
map $http_x_request_id $clip_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. With the upstream held in a variable nginx looks it
    # up per request, so it starts before the backend exists and follows the
    # backend to a new address when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Uploads are capped at 50 MiB by the backend (MAX_UPLOAD_BYTES); nginx's
    # default of 1 MiB would refuse them first.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Declared here and not inside any location, because an
    # add_header in a location replaces every one inherited from the server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # docs/teams-frontend-security.md: must be an HTTP header, and there must be
    # no X-Frame-Options. Whether to add script-src and the rest is a
    # deployment decision, not made here.
    add_header Content-Security-Policy "frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://*.cloud.microsoft;" always;

    # Settings every proxied location shares. All proxy_set_header lines live
    # here and none in a location: one location-level proxy_set_header replaces
    # every inherited one, which silently drops X-Forwarded-For and the rest.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $clip_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live session socket. uvicorn sends a protocol ping every 20 s (the
    # frontend sends none of its own), and nginx counts any frame from the
    # backend as activity. The timeouts are far above that so a class of an
    # hour or more, or a student who is silent for most of it, is not cut off.
    location /ws/ {
        proxy_pass $backend;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }

    # The tutor's reply is streamed as NDJSON. The backend sends
    # X-Accel-Buffering: no, which nginx honours; this makes it explicit and
    # keeps the route unbuffered if that header is ever lost.
    location ~ ^/api/v1/sessions/[^/]+/chat$ {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # Interactive docs exist only outside production.
    location ~ ^/(docs|redoc)$ {
        proxy_pass $backend;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The SPA. Any other path falls back to index.html so a deep link or a
    # reload on a client-side route works. index.html names the hashed assets,
    # so it must not be cached.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
