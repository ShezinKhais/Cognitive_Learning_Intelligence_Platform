services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clip
      POSTGRES_PASSWORD: clip_dev_password
      POSTGRES_DB: clip
    ports:
      - "5432:5432"
    volumes:
      - clip_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clip -d clip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: clip-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLIP_ENV: development
      DATABASE_URL: postgresql+asyncpg://clip:clip_dev_password@db:5432/clip
      # Ollama runs on the host machine, not in a container.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: clip-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"

volumes:
  clip_pgdata:
