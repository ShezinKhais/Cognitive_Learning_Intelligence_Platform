services:
  backend:
    build:
      args:
        ENABLE_LIVE_TRANSCRIPTION: "true"
    environment:
      LIVE_TRANSCRIPTION_ENABLED: "true"
      LIVE_TRANSCRIPTION_MODEL_PATH: /data/models/faster-whisper-base
      LIVE_TRANSCRIPTION_LANGUAGE: auto
      LIVE_TRANSCRIPTION_CPU_THREADS: "2"
    volumes:
      - "${CLIP_WHISPER_MODEL_DIR:?set CLIP_WHISPER_MODEL_DIR}:/data/models/faster-whisper-base:ro"
