name: CI

on:
  # Every branch, not just main: six people working in parallel need their work
  # checked before it reaches a pull request.
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clip
          POSTGRES_PASSWORD: clip_dev_password
          POSTGRES_DB: clip_test
        ports:
          - 5432:5432
        # Without a health check the job starts testing while Postgres is still
        # initialising, which fails intermittently rather than consistently.
        options: >-
          --health-cmd "pg_isready -U clip -d clip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://clip:clip_dev_password@localhost:5432/clip_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create extensions
        # A service container does not run init-db.sql, so the extensions our
        # schema depends on have to be created explicitly.
        run: |
          PGPASSWORD=clip_dev_password psql -h localhost -U clip -d clip_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Install Tesseract
        # So test_real_tesseract_reads_a_scanned_page runs the real OCR path
        # here instead of skipping it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: API contract is in sync with the code
        run: python scripts/export_contract.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # tsconfig.json is a solution file: "files": [] plus references. Under
      # that layout `tsc --noEmit` compiles nothing and passes on a file with a
      # blatant type error, so the typecheck has to go through the references.
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  student-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser == 'edge' && 'msedge' || 'chrome' }}
      - run: npm run check:browser
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-browser-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deployment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable development stack only; these are not deployment secrets.
    env:
      COMPOSE_PROJECT_NAME: clip-ci-integration
      DEMO_DB_PASSWORD: clip_ci_disposable_database
      CLIP_SECRET_KEY: clip-ci-disposable-signing-key-not-for-production
      CLIP_ENV: development
      DEMO_PORT: "8088"
      OCR_IN_IMAGE: "true"
      CLIP_RELEASE_SHA: ${{ github.sha }}
      AI_WARMUP_ENABLED: "false"
      CLIP_DEPLOYMENT_TEST_URL: http://localhost:8088
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start isolated deployment
        run: docker compose -p clip-ci-integration -f docker-compose.demo.yml up -d --build --wait --wait-timeout 180
      - name: Verify external HTTP, database, cookie and WebSocket connections
        run: |
          pip install httpx websockets
          docker compose -p clip-ci-integration -f docker-compose.demo.yml exec -T backend python - < backend/scripts/check_deployed_ocr.py &
          ocr_pid=$!
          smoke_status=0
          python backend/scripts/smoke_test.py --base http://localhost:8088 --idle 2 || smoke_status=$?
          wait "$ocr_pid"
          exit "$smoke_status"
      - name: Verify web and API revision
        run: |
          python backend/scripts/check_deployed_release.py --base http://localhost:8088 --revision "$CLIP_RELEASE_SHA"
      - name: Install deployed-browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real student, lecturer and admin shell
        working-directory: frontend
        run: npm run test:deployment
      - name: Deployment diagnostics
        if: failure()
        run: docker compose -p clip-ci-integration -f docker-compose.demo.yml logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-browser
          path: frontend/deployment-test-results/
          retention-days: 7
      - name: Stop isolated deployment
        if: always()
        run: docker compose -p clip-ci-integration -f docker-compose.demo.yml down --volumes

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the filled package against Microsoft's manifest schema
        run: |
          pip install jsonschema==4.26.0
          curl --fail --silent --show-error --max-time 30 https://developer.microsoft.com/en-us/json-schemas/teams/v1.17/MicrosoftTeams.schema.json -o "$RUNNER_TEMP/teams-schema.json"
          echo "87a5c136c48597686402ee509c4de59fc54f53b8262649c5fbf01748affc938e  $RUNNER_TEMP/teams-schema.json" | sha256sum --check
          python backend/scripts/package_teams_app.py --check --schema "$RUNNER_TEMP/teams-schema.json"
